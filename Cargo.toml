[package]
name = "viewport-lib-gizmo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Standalone transform gizmo for viewport-lib scenes: renderer-free hit-testing, drag projection, snapping, and overlay building."
license = "GPL-3.0-only"
autoexamples = false

[dependencies]
glam = { version = "=0.30.10", features = ["bytemuck"] }
viewport-lib-types = { path = "../viewport-lib/crates/viewport-lib-types" }

[dev-dependencies]
# The renderer is needed only by examples that draw the overlay items, not by
# the library itself. The `app` feature adds the `ViewportApp` fullscreen runner
# used by the rendering examples.
viewport-lib = { path = "../viewport-lib/crates/viewport-lib", features = [
    "app",
    "egui-adapter",
] }
# eframe drives the sidebar example. Pinned to the version viewport-lib's own
# eframe examples use (the wgpu 27 leg).
eframe = { version = "=0.33.3", default-features = false, features = ["wgpu", "default_fonts"] }

# A layer-1 example: a custom gizmo built from the maths helpers alone, no
# controller and no renderer.
[[example]]
name = "custom_gizmo"
path = "examples/custom_gizmo.rs"

# A gizmo drawn over one object, driven end to end with the ViewportApp runner.
[[example]]
name = "gizmo_basic"
path = "examples/gizmo_basic.rs"

# An eframe app whose sidebar restyles the gizmo live.
[[example]]
name = "gizmo_styling"
path = "examples/gizmo_styling.rs"
