[package]
name = "viewport-lib-gizmo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Standalone transform gizmo for viewport-lib scenes: renderer-free hit-testing, drag projection, snapping, and overlay building."
license = "GPL-3.0-only"
repository = "https://github.com/grimandgreedy/viewport-lib-gizmo"
exclude = ["assets/"]
autoexamples = false

[dependencies]
glam = { version = "=0.30.10", features = ["bytemuck"] }
viewport-lib-types = "0.3"

# Only the examples draw anything.
[dev-dependencies]
viewport-lib = { version = "0.23", features = ["app", "egui-adapter"] }
eframe = { version = "=0.33.3", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }

[workspace]
members = ["ui"]

[[example]]
name = "gizmo_basic"
path = "examples/gizmo_basic.rs"

[[example]]
name = "gizmo_multi_viewport"
path = "examples/gizmo_multi_viewport.rs"

[[example]]
name = "gizmo_styling"
path = "examples/gizmo_styling.rs"
