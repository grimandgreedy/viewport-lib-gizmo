[package]
name = "viewport-lib-gizmo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Standalone transform gizmo for viewport-lib scenes: renderer-free hit-testing, drag projection, snapping, and overlay building."
license = "GPL-3.0-only"
autoexamples = false

[features]
default = []
# The `ui` frontend: a viewport-lib-ui Custom widget that draws the gizmo through
# the toolkit's draw path and reports a transform delta. It pulls only the two
# renderer-free viewport-lib-ui crates (both pure Rust and serde-only), so the
# default build stays on viewport-lib-types + glam and never touches the renderer.
ui = ["dep:viewport-lib-ui-core", "dep:viewport-lib-ui-document", "dep:serde"]

[dependencies]
glam = { version = "=0.30.10", features = ["bytemuck"] }
viewport-lib-types = { path = "../viewport-lib/crates/viewport-lib-types" }
# Only under the `ui` feature. Layout, interaction, and the DrawCommand vocabulary,
# with no viewport-lib or wgpu dependency; document is the serializable widget tree.
viewport-lib-ui-core = { path = "../viewport-lib-ui/crates/core", optional = true }
viewport-lib-ui-document = { path = "../viewport-lib-ui/crates/document", optional = true }
# Only under `ui`. Lets the tool report its transform delta as a typed result the
# host reads back, and define the output schema. Pure Rust, no renderer.
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
# The renderer is needed only by examples that draw the overlay items, not by
# the library itself. The `app` feature adds the `ViewportApp` fullscreen runner
# used by the rendering examples.
viewport-lib = { path = "../viewport-lib/crates/viewport-lib", features = [
    "app",
    "egui-adapter",
] }
# eframe drives the sidebar example. Pinned to the version viewport-lib's own
# eframe examples use (the wgpu 27 leg).
eframe = { version = "=0.33.3", default-features = false, features = ["wgpu", "default_fonts"] }

# A gizmo drawn over one object, driven end to end with the ViewportApp runner.
[[example]]
name = "gizmo_basic"
path = "examples/gizmo_basic.rs"

# An eframe app whose sidebar restyles the gizmo live.
[[example]]
name = "gizmo_styling"
path = "examples/gizmo_styling.rs"
